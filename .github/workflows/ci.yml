name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-snapshots

    steps:
      - name: Checkout agent-snapshots
        uses: actions/checkout@v4
        with:
          path: agent-snapshots

      # agent-session-core is intentionally checked out at its default branch HEAD.
      # This is a sibling checkout for the file:../agent-session-core dependency, not a submodule.
      - name: Checkout agent-session-core
        uses: actions/checkout@v4
        with:
          repository: ffffhx/agent-session-core
          path: agent-session-core

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agent-snapshots/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Verify generated artifacts
        run: pnpm test:generated
